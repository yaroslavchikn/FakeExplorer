name: Build Chrome Copy EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name Chrome main.py --noconfirm --hidden-import=PyQt5.QtWebEngineWidgets --hidden-import=PyQt5.QtWebEngineCore --add-data "C:\hostedtoolcache\windows\Python\3.10.*\x64\Lib\site-packages\PyQt5\Qt5\plugins;plugins"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChromeCopy
        path: dist/Chrome.exe
