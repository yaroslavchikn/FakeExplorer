name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Рекомендуется обновить и checkout до v4
    
    - name: Set up Python
      uses: actions/setup-python@v5 # И setup-python до v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        # Упрощенная и более надежная команда для PyInstaller
        pyinstaller --onefile --windowed --name Explorer main.py --noconfirm
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4 # ГЛАВНОЕ ИЗМЕНЕНИЕ: v3 -> v4
      with:
        name: Explorer
        path: dist/Explorer.exe
