name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name Explorer main.py --noconfirm --no-console --add-binary "C:\hostedtoolcache\windows\Python\3.10.*\x64\Lib\site-packages\PyQt5\Qt5\bin\*.dll;." --add-data "C:\hostedtoolcache\windows\Python\3.10.*\x64\Lib\site-packages\PyQt5\Qt5\plugins\platforms;platforms"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: Explorer
        path: dist/Explorer.exe
